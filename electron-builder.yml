# electron-builder 打包配置
# 本项目发布未签名安装包：不配置 CSC_LINK/CSC_KEY_PASSWORD，也不做公证；用户按 README 指引手动放行安装
# afterPack 剥离 Mach-O 的 linker 签名（macOS 15 起 linker-signed 且无 bundle seal 的 app 会被判「已损坏」且右键打开无效；完全未签名只提示「无法验证开发者」，右键可放行）
appId: com.syncwave.app
productName: SyncWave
afterPack: scripts/mac-unsign.cjs

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - '!src/**'
  - '!tests/**'
  - '!docs/**'
  - '!music_logos/**'
  - '!build/*.svg'
  - '!playlist.txt'
  - '!planning.md'
  - '!PRD.md'
  - '!CLAUDE.md'

# native 模块（better-sqlite3）不能从 asar 内加载
asarUnpack:
  - '**/*.node'

# 自动更新唯一发布源（GitHub Releases）：发布时设置 GH_TOKEN 后执行
#   npx electron-builder --publish always
publish:
  provider: github
  owner: b1tzer
  repo: playlist-syncwave

npmRebuild: true

mac:
  category: public.app-category.music
  icon: build/icon.png
  target:
    - dmg
    - zip

win:
  icon: build/icon.png
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: '${productName}-Setup-${version}.${ext}'

dmg:
  artifactName: '${productName}-${version}.${ext}'

linux:
  icon: build/icon.png
  category: AudioVideo
  target:
    - AppImage
