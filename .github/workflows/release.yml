# 发布流程：tag(v*) 触发 → 校验 → 三平台签名构建 → draft release → 人工转正式 → Gitee 备用源同步
# workflow_dispatch 仅用于构建预演（不发布、不校验签名 secrets）
# 回滚只能发更高版本，不要重发同版本覆盖
name: release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: verify · tag 与发布凭据
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与 package.json 版本一致
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "v${version}" ]; then
            echo "::error::tag ${tag} 与 package.json 版本 v${version} 不一致"
            exit 1
          fi
          echo "发布版本: ${version}"

      - name: 校验签名与公证 secrets
        if: github.event_name == 'push'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少发布 secret: ${name}（见 README「发布流程」）"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "签名与公证凭据齐全"

      - name: 预演模式
        if: github.event_name == 'workflow_dispatch'
        run: echo "构建预演：只产出 Artifacts，不发布、不校验签名 secrets"

  build:
    name: build · ${{ matrix.target }}
    needs: verify
    if: github.event_name != 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  draft:
    name: draft release · 待人工复核
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 校验三平台更新元数据
        run: |
          set -euo pipefail
          for file in latest.yml latest-mac.yml latest-linux.yml; do
            if [ ! -f "dist/${file}" ]; then
              echo "::error::缺少更新元数据 ${file}，自动更新会失效"
              exit 1
            fi
          done

      - name: 创建 draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --draft --title "SyncWave $tag" --generate-notes
          fi
          echo "已生成 draft release: ${tag}（人工复核安装包与更新元数据后转正式发布）"

  sync-gitee:
    name: sync gitee fallback feed
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 跳过未配置 token
        if: env.GITEE_TOKEN == ''
        run: echo "::warning::GITEE_TOKEN 未配置，跳过 Gitee 备用源同步"

      - name: 下载正式发布资产
        if: env.GITEE_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$RELEASE_TAG" --dir dist --clobber

      - name: 推送到 Gitee release 分支
        if: env.GITEE_TOKEN != ''
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tmpdir=$(mktemp -d)
          git clone --depth 1 "https://gitee.com/bibobibo_309/playlist-syncwave.git" "$tmpdir/repo"
          cd "$tmpdir/repo"
          git fetch origin release 2>/dev/null || true
          git checkout -B release origin/release 2>/dev/null || git checkout -B release
          mkdir -p releases
          cp "${GITHUB_WORKSPACE}/dist/"* releases/
          git add -A
          git -c user.name='release-bot' -c user.email='release-bot@users.noreply.github.com' \
            commit -m "release: v${version}" || echo "nothing to commit"
          git remote set-url origin "https://bibobibo_309:${GITEE_TOKEN}@gitee.com/bibobibo_309/playlist-syncwave.git"
          git push origin release
