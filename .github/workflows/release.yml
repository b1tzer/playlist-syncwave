# 发布流程：tag(v*) 触发 → 校验 tag 版本 → 三平台未签名构建 → draft release → 人工转正式
# 本项目不购买代码签名/公证证书，构建不校验也不提示签名凭据；用户按平台提示手动放行安装
# workflow_dispatch 仅用于构建预演（不发布）
# 回滚只能发更高版本，不要重发同版本覆盖
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: verify · tag 版本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与 package.json 版本一致
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "v${version}" ]; then
            echo "::error::tag ${tag} 与 package.json 版本 v${version} 不一致"
            exit 1
          fi
          echo "发布版本: ${version}"

  build:
    name: build · ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error

  draft:
    name: draft release · 待人工复核
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 校验三平台更新元数据
        run: |
          set -euo pipefail
          for file in latest.yml latest-mac.yml latest-linux.yml; do
            if [ ! -f "dist/${file}" ]; then
              echo "::error::缺少更新元数据 ${file}，自动更新会失效"
              exit 1
            fi
          done

      - name: 创建 draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # 从 CHANGELOG.md 提取本版本章节作为 release notes（--generate-notes 依赖 PR 元数据，本项目直推 main 会生成空文本）
          awk -v v="${version}" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found
          ' CHANGELOG.md > release-notes.md
          {
            echo "> **未签名安装包**：macOS 若被 Gatekeeper 拦截，右键安装包 →「打开」；Windows SmartScreen 提示时选「更多信息」→「仍要运行」。本项目不购买代码签名/公证证书。"
            echo ""
            cat release-notes.md
          } > release-notes.tmp
          mv release-notes.tmp release-notes.md
          mapfile -t assets < <(find dist -maxdepth 1 -type f -print)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::dist 中没有可上传的文件"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" "${assets[@]}" --draft --title "SyncWave $tag" --notes-file release-notes.md
          fi
          echo "已生成 draft release: ${tag}（人工复核安装包与更新元数据后转正式发布）"
