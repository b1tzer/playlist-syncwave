# 校验流水线:每次 push(任意分支)/ PR 触发
# check 通过后,main 分支推送自动同步代码到 Gitee
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    name: check · lint / typecheck / test / build / package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 缓存 Electron 二进制与 electron-builder 下载物,加速打包预检查
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-cache-${{ runner.os }}-

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # 打包预检查:只产 unpacked 目录(跳过归档/签名/发布),
      # 覆盖 electron-builder.yml 合法性、better-sqlite3 rebuild、文件收集与图标资源
      - name: package precheck
        run: npx electron-builder --linux dir --publish never

  sync-gitee:
    name: sync to gitee
    needs: check
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    # 需在 GitHub 仓库 Settings → Secrets and variables → Actions
    # 配置 GITEE_TOKEN(Gitee 私人令牌:https://gitee.com/personal_access_tokens)
    # 注意:secrets 不能直接用于 if 条件,先注入 env 再判断 env.GITEE_TOKEN
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: skip gitee
        if: env.GITEE_TOKEN == ''
        run: echo "GITEE_TOKEN 未配置,跳过 Gitee 同步"

      - name: push to gitee
        if: env.GITEE_TOKEN != ''
        run: |
          set -euo pipefail
          git remote add gitee "https://bibobibo_309:${GITEE_TOKEN}@gitee.com/bibobibo_309/playlist-syncwave.git"
          git push gitee main
          git push gitee --tags || echo "no tags to sync"
