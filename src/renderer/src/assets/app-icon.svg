<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Matte Metallic Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b1d25" />
      <stop offset="100%" stop-color="#0a0b0e" />
    </linearGradient>

    <!-- Bevel & Highlights for macOS squircle -->
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Top Arc Smooth Gradient: Multi-stop rich transition from Netease Crimson Red to Emerald Green -->
    <linearGradient id="topSyncGradSmooth" x1="140" y1="210" x2="368" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f03e3e" />
      <stop offset="35%" stop-color="#ea580c" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Bottom Arc Enhanced High-Contrast Gradient: Electric Cyan -> Emerald Green -> Vibrant Spring Green -> High-Light Lime -->
    <linearGradient id="bottomSyncGradEnhanced" x1="365" y1="280" x2="145" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="25%" stop-color="#10b981" />
      <stop offset="65%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>

    <!-- macOS Soft Ambient Shadow -->
    <filter id="macOSShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000000" flood-opacity="0.68" />
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.38" />
    </filter>

    <!-- Smooth Precision Glow -->
    <filter id="smoothGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- macOS Squircle Clip -->
    <clipPath id="squircle">
      <rect x="48" y="48" width="416" height="416" rx="92" ry="92" />
    </clipPath>
  </defs>

  <!-- Ambient Shadow -->
  <rect x="48" y="48" width="416" height="416" rx="92" ry="92" fill="#000000" filter="url(#macOSShadow)" />

  <!-- Main Container -->
  <g clip-path="url(#squircle)">
    <!-- Base Canvas -->
    <rect x="48" y="48" width="416" height="416" fill="url(#bgGrad)" />

    <!-- Ambient Subtle Track Ring -->
    <circle cx="256" cy="256" r="108" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1.5" />

    <!-- Synchronous Orbits with Soft Rounded Solid Arrowheads -->
    <g filter="url(#smoothGlow)">
      <!-- Top Arc: Circle track from 195° to 342° -->
      <path d="M 151.7 228.0 A 108 108 0 0 1 358.5 221.5"
            fill="none" stroke="url(#topSyncGradSmooth)" stroke-width="12" stroke-linecap="round" />

      <!-- Top Soft Rounded Solid Arrowhead (seamlessly caps and aligns with arc at 345°) -->
      <path d="M 346.5 227.0 
               C 349.5 230.5 358.0 240.0 362.5 244.5 
               Q 365.2 247.2 367.0 243.8 
               C 369.2 239.5 373.0 227.5 373.8 221.0 
               Q 374.5 216.5 370.0 217.8 
               C 364.0 219.5 352.0 223.0 347.5 224.2 
               Q 344.2 225.0 346.5 227.0 Z" 
            fill="#10b981" />

      <!-- Bottom Arc: Circle track from 15° to 162° with vivid Cyan to Lime Green gradient -->
      <path d="M 360.3 284.0 A 108 108 0 0 1 153.5 290.5"
            fill="none" stroke="url(#bottomSyncGradEnhanced)" stroke-width="12" stroke-linecap="round" />

      <!-- Bottom Soft Rounded Solid Arrowhead (Matches endpoint color #a3e635) -->
      <path d="M 165.5 285.0 
               C 162.5 281.5 154.0 272.0 149.5 267.5 
               Q 146.8 264.8 145.0 268.2 
               C 142.8 272.5 139.0 284.5 138.2 291.0 
               Q 137.5 295.5 142.0 294.2 
               C 148.0 292.5 160.0 289.0 164.5 287.8 
               Q 167.8 287.0 165.5 285.0 Z" 
            fill="#a3e635" />
    </g>

    <!-- Center Clean Audio Wave (5 distinct rounded vertical bars, centered at x=256, y=256) -->
    <g filter="url(#smoothGlow)">
      <!-- Bar 1 (x=204, cyan tint) -->
      <rect x="204" y="234" width="12" height="44" rx="6" fill="#38bdf8" fill-opacity="0.5" />

      <!-- Bar 2 (x=228, emerald tint) -->
      <rect x="228" y="206" width="12" height="100" rx="6" fill="#34d399" fill-opacity="0.85" />

      <!-- Bar 3 (x=250, dominant white center bar) -->
      <rect x="250" y="176" width="12" height="160" rx="6" fill="#ffffff" />

      <!-- Bar 4 (x=272, emerald tint) -->
      <rect x="272" y="206" width="12" height="100" rx="6" fill="#10b981" fill-opacity="0.85" />

      <!-- Bar 5 (x=296, lime tint) -->
      <rect x="296" y="234" width="12" height="44" rx="6" fill="#a3e635" fill-opacity="0.5" />
    </g>

    <!-- Inner Border for crisp Apple-style bevel & edge rim -->
    <rect x="49" y="49" width="414" height="414" rx="91" ry="91" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />
    <rect x="48" y="48" width="416" height="416" rx="92" ry="92" fill="none" stroke="url(#rimLight)" stroke-width="2.5" />
  </g>
</svg>
